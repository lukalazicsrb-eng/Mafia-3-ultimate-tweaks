name: Mafia III capture launcher

on:
  push:
    tags:
      - mafia-capture-v*

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Check RenderDoc setup and export on Windows
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'Mafia III capture test'
          Copy-Item capture $stage -Recurse
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File (Join-Path $stage 'snimi-mafia.ps1') -TestExporter
          if ($LASTEXITCODE -ne 0) { throw 'Preparing or invoking RenderDoc failed' }
          $report = Get-Content -LiteralPath (Join-Path $stage 'export-test/RenderDoc analiza.txt') -Raw
          if ($report -notmatch 'Snimak empty.rdc' -or $report -notmatch 'Analiza nije zavrsena') {
            throw 'The exporter did not handle an invalid capture as expected'
          }
          Write-Host $report

      - name: Publish the capture ZIP
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path capture/* -DestinationPath Snimi-Mafia-III.zip
          gh release create $env:GITHUB_REF_NAME Snimi-Mafia-III.zip `
            --repo $env:GITHUB_REPOSITORY --verify-tag --prerelease --latest=false `
            --title 'Snimi Mafia III' `
            --notes 'Raspakuj ZIP i pokreni Snimi Mafia III.cmd. U igri pritisni F12, zatim izadji da se sacuva Mafia III rezultat.txt. Pokretac preuzima zvanicni RenderDoc i cuva snimke lokalno.'

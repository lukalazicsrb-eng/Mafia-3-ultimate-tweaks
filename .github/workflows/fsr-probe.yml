name: Windows FSR interop probe

on:
  push:
    paths:
      - .github/workflows/fsr-probe.yml
      - probe/**
    tags:
      - fsr-test-v*
  pull_request:
    paths:
      - .github/workflows/fsr-probe.yml
      - probe/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build x64 Release
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Check out probe source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Check out AMD FSR SDK 2.4.0 headers
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: GPUOpen-LibrariesAndSDKs/FidelityFX-SDK
          ref: 7539ae8b6568ad29ed78a753404351daf3b5cca7 # v2.4.0
          path: .sdk/fidelityfx
          persist-credentials: false
          sparse-checkout: |
            Kits/FidelityFX/api/include
            Kits/FidelityFX/upscalers/include

      - name: Configure
        shell: pwsh
        run: cmake -S probe -B build -G 'Visual Studio 17 2022' -A x64 "-DFSR_SDK_ROOT=$env:GITHUB_WORKSPACE/.sdk/fidelityfx"

      - name: Compile
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Install binary
        shell: pwsh
        run: cmake --install build --config Release --prefix "$env:GITHUB_WORKSPACE/package"

      - name: Check Windows command-line entry point
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/package/fsr-interop-probe.exe"
          if ($LASTEXITCODE -ne 2) { throw "Expected usage exit code 2, got $LASTEXITCODE" }
          exit 0

      - name: Check Mafia III texture conversions on D3D11 WARP
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/package/fsr-interop-probe.exe" --verify-game-conversion
          if ($LASTEXITCODE -ne 0) { throw 'D3D11 game texture conversion failed' }
          exit 0

      - name: Check first launch and cached runtimes with Windows PowerShell
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'FSR test Windows'
          Copy-Item package $stage -Recurse
          $script = Join-Path $stage 'run-probe.ps1'
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $script -PrepareOnly
          if ($LASTEXITCODE -ne 0) { throw 'Preparing the runtime failed' }
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $script -PrepareOnly
          if ($LASTEXITCODE -ne 0) { throw 'Preparing the cached runtime failed' }
          exit 0

      - name: Upload Windows x64 build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FSR-test-za-Windows
          path: package/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/fsr-test-v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download the verified build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: FSR-test-za-Windows
          path: package

      - name: Publish the Windows ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -j FSR-test-za-Windows.zip package/*
          gh release create "$GITHUB_REF_NAME" FSR-test-za-Windows.zip \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false \
            --title 'FSR test za Windows' \
            --notes 'Pokreni Proveri formate Mafia III.cmd za Native AA probu 2560x1440 sa formatima iz igre. Rezultat se cuva kao Mafia III FSR formati.txt. Proba koristi sinteticke frejmove izvan igre.'
